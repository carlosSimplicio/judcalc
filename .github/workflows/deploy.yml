name: Test, build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Test backend
        working-directory: backend
        run: go test ./...
      - name: Test database tooling
        run: |
          python -m pip install -r python/requirements.txt
          python -m unittest discover -s python/tests
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate production API URL
        if: matrix.component == 'frontend'
        env:
          API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
        run: test -n "$API_BASE_URL"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        id: image
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          tags: |
            ${{ steps.image.outputs.prefix }}/${{ matrix.component }}:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}/${{ matrix.component }}:latest
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Copy deployment definition
        run: |
          ssh -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" 'mkdir -p ~/judcalc'
          scp -P "$SSH_PORT" compose.production.yaml "$VPS_USER@$VPS_HOST:judcalc/compose.production.yaml"
      - name: Deploy containers
        shell: bash
        run: |
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | ssh -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          ssh -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" \
            "cd ~/judcalc && test -f .env && IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$GITHUB_SHA' docker compose --env-file .env -f compose.production.yaml pull && IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$GITHUB_SHA' docker compose --env-file .env -f compose.production.yaml up -d --remove-orphans --wait"
