name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Test backend
        working-directory: backend
        run: go test ./...
      - name: Test database tooling
        run: |
          python -m pip install -r python/requirements.txt
          python -m unittest discover -s python/tests
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: git archive --format=tar.gz --output="judcalc-$GITHUB_SHA.tar.gz" "$GITHUB_SHA"
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Copy source to VPS
        run: |
          ssh -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" 'mkdir -p ~/judcalc/releases'
          scp -P "$SSH_PORT" "judcalc-$GITHUB_SHA.tar.gz" "$VPS_USER@$VPS_HOST:judcalc/"
      - name: Build and deploy on VPS
        run: |
          ssh -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" "DEPLOY_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -eu
          deploy_root="$HOME/judcalc"
          release_dir="$deploy_root/releases/$DEPLOY_SHA"
          archive="$deploy_root/judcalc-$DEPLOY_SHA.tar.gz"

          test -f "$deploy_root/.env"
          mkdir -p "$release_dir"
          tar -xzf "$archive" -C "$release_dir"
          cd "$release_dir"

          compose_file="infra/compose.production.yaml"
          IMAGE_TAG="$DEPLOY_SHA" docker compose --env-file "$deploy_root/.env" -f "$compose_file" config --quiet
          IMAGE_TAG="$DEPLOY_SHA" docker compose --env-file "$deploy_root/.env" -f "$compose_file" build --pull
          IMAGE_TAG="$DEPLOY_SHA" docker compose --env-file "$deploy_root/.env" -f "$compose_file" up -d --remove-orphans --wait

          rm -f "$archive"
          REMOTE
