name: judcalc

services:
  backend:
    image: "${IMAGE_PREFIX:?IMAGE_PREFIX is required}/backend:${IMAGE_TAG:?IMAGE_TAG is required}"
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_PATH: "/app/data/app.db"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}"
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  frontend:
    image: "${IMAGE_PREFIX:?IMAGE_PREFIX is required}/frontend:${IMAGE_TAG:?IMAGE_TAG is required}"
    restart: unless-stopped
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

volumes:
  backend_data:
