name: judcalc

services:
  backend:
    image: "judcalc-backend:${IMAGE_TAG:?IMAGE_TAG is required}"
    pull_policy: never
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_PATH: "/app/data/app.db"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}"
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  frontend:
    image: "judcalc-frontend:${IMAGE_TAG:?IMAGE_TAG is required}"
    pull_policy: never
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  nginx:
    image: nginx:stable-alpine
    container_name: judcalc-nginx
    pull_policy: always
    restart: unless-stopped
    environment:
      DOMAIN: "${DOMAIN:?DOMAIN is required}"
      NGINX_ENVSUBST_FILTER: "^DOMAIN$"
      NGINX_RELOAD_INTERVAL: "6h"
    ports:
      - "${HOST_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HOST_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx-reload-certificates.sh:/docker-entrypoint.d/99-reload-certificates.sh:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  certbot:
    image: certbot/certbot:latest
    container_name: judcalc-certbot
    pull_policy: always
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          certbot renew --webroot --webroot-path /var/www/certbot --quiet
          sleep 12h
        done
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot

volumes:
  backend_data:
  letsencrypt:
    name: judcalc_letsencrypt
  certbot_webroot:
    name: judcalc_certbot_webroot
